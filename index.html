<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - Team DevOps</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Team DevOps - Practice Project</p>

    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
      <div class="box" id="box-1"></div>
      <div class="box" id="box-2"></div>
      <div class="box" id="box-3"></div>
      <div class="box" id="box-4"></div>
      <div class="box" id="box-5"></div>
      <div class="box" id="box-6"></div>
      <div class="box" id="box-7"></div>
      <div class="box" id="box-8"></div>
      <div class="box" id="box-9"></div>
    </div>

    <div class="scoreboard">
      <p>Player X: <span id="score-x">0</span></p>
      <p>Draw: <span id="score-draw">0</span></p>
      <p>Player O: <span id="score-o">0</span></p>
    </div>

    <button id="reset-btn">Restart Game</button>
    <p class="footer">Made by Shiva, Mohit, Aatish & Yogit</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
